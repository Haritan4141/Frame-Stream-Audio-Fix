name: Verify hardened candidate
on:
  push:
    branches: [hardened, 'hardened/**']
  pull_request:
    branches: [hardened, 'hardened/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Public-tree scope, syntax and fixed runtime hashes
        run: python -B scripts/check_public_tree.py
      - name: Fault injection (fake scheduler and service backends)
        working-directory: hardened
        run: python -B test_guard.py
      - name: Bash syntax, upstream regression and ShellCheck
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n hardened/frame-stream-audio-fix hardened/reproduce_upstream_filter.sh
          bash hardened/reproduce_upstream_filter.sh
          shellcheck --version
          shellcheck hardened/frame-stream-audio-fix hardened/reproduce_upstream_filter.sh
